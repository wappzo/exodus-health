<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exodus Health — Email Signature</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }
    .preview-label {
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .signature-wrapper {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 32px;
    }

    /* ── Signature body ── */
    .sig-divider {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #555;
      margin: 0 0 8px 0;
    }
    .sig-regards {
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #222;
      margin: 0 0 16px 0;
    }
    .sig-name {
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #0F2040;
      margin: 0 0 2px 0;
    }
    .sig-role {
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #0F2040;
      margin: 0 0 20px 0;
    }

    /* ── Logo row ── */
    .sig-logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    .sig-logo-icon {
      flex-shrink: 0;
    }
    .sig-wordmark {
      line-height: 1;
    }
    .sig-wordmark-text {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 28px;
      line-height: 1;
      display: block;
    }
    .sig-wordmark-exodus {
      color: #1E6FD9;
      font-weight: 400;
    }
    .sig-wordmark-health {
      color: #0F2040;
      font-weight: 700;
    }
    .sig-tagline {
      font-family: Arial, sans-serif;
      font-size: 10px;
      color: #6A88AB;
      letter-spacing: 0.14em;
      margin-top: 5px;
      display: block;
    }

    /* ── Separator ── */
    .sig-rule {
      border: none;
      border-top: 1px solid #D8E3F0;
      margin: 16px 0;
    }

    /* ── Contact rows ── */
    .sig-contact {
      display: table;
      border-collapse: collapse;
      width: 100%;
    }
    .sig-contact-row {
      display: table-row;
    }
    .sig-contact-label {
      display: table-cell;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #6A88AB;
      padding: 3px 10px 3px 0;
      white-space: nowrap;
      vertical-align: top;
      width: 20px;
    }
    .sig-contact-value {
      display: table-cell;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #0F2040;
      padding: 3px 0;
      vertical-align: top;
    }
    .sig-contact-value a {
      color: #1E6FD9;
      text-decoration: none;
    }
    .sig-contact-value a:hover {
      text-decoration: underline;
    }
    .sig-address {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #6A88AB;
      margin-top: 10px;
      line-height: 1.6;
    }

    /* ── Copy button ── */
    .copy-btn {
      display: block;
      margin: 24px auto 0;
      padding: 10px 28px;
      background: #1E6FD9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
    }
    .copy-btn:hover { background: #1558B0; }
  </style>
</head>
<body>

  <p class="preview-label">Email Signature Preview — Exodus Health</p>

  <div class="signature-wrapper">

    <!-- Signature start (copy everything inside #sig-body) -->
    <div id="sig-body">

      <p class="sig-divider">--</p>
      <p class="sig-regards">Regards</p>

      <p class="sig-name">Prashant Fernandes</p>
      <p class="sig-role">Director</p>

      <!-- Logo -->
      <div class="sig-logo-row">
        <!-- Icon — inline SVG, blue theme -->
        <svg class="sig-logo-icon" width="52" height="50" viewBox="0 0 172 167" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g clip-path="url(#sig-clip)">
            <path d="M168.351 83.5V92.3719H125.612V74.6282H150.63C145.939 43.3157 119.357 19.3094 86.5207 19.3094C51.0783 19.3094 22.4116 48.0125 22.4116 83.5C22.4116 118.988 51.0783 148.213 86.5207 148.213V165.434C41.6965 165.434 4.69043 128.903 4.69043 83.5C4.69043 38.6188 41.6965 1.56567 86.5207 1.56567C131.866 1.56567 168.351 38.6188 168.351 83.5Z" fill="#1E6FD9"/>
            <path d="M132.337 16.1159L139.693 21.0115L127.591 30.0852L122.611 25.9133L115.203 25.9133C86.6524 12.5241 52.08 21.3167 33.9605 48.5421C14.4029 77.9283 22.3828 117.535 51.8063 137.118C81.2298 156.7 121.28 149.059 140.837 119.673L155.116 129.176C130.382 166.341 79.6723 176.865 42.0275 151.811C4.81538 127.045 -5.48584 75.9158 19.2487 38.7509C44.2709 1.15392 95.1253 -8.65016 132.337 16.1159Z" fill="#1E6FD9"/>
            <path d="M115.709 74.6281V92.3719H58.376V74.6281H115.709Z" fill="#0F2040"/>
            <path d="M95.382 109.594H77.6608V57.4062H95.382V109.594Z" fill="#0F2040"/>
          </g>
          <defs>
            <clipPath id="sig-clip"><rect width="172" height="167" fill="white"/></clipPath>
          </defs>
        </svg>

        <!-- Wordmark + tagline -->
        <div class="sig-wordmark">
          <span class="sig-wordmark-text">
            <span class="sig-wordmark-exodus">Exodus </span><span class="sig-wordmark-health">Health</span>
          </span>
          <span class="sig-tagline">Empowering health, Inspiring change</span>
        </div>
      </div>

      <hr class="sig-rule" />

      <!-- Contact details -->
      <div class="sig-contact">
        <div class="sig-contact-row">
          <span class="sig-contact-label">T</span>
          <span class="sig-contact-value"><a href="tel:02082520078">0208 252 0078</a></span>
        </div>
        <div class="sig-contact-row">
          <span class="sig-contact-label">M</span>
          <span class="sig-contact-value"><a href="tel:07982906637">07982 906 637</a></span>
        </div>
        <div class="sig-contact-row">
          <span class="sig-contact-label">E</span>
          <span class="sig-contact-value"><a href="mailto:prashant@exodushealth.uk">prashant@exodushealth.uk</a></span>
        </div>
        <div class="sig-contact-row">
          <span class="sig-contact-label">W</span>
          <span class="sig-contact-value"><a href="https://www.exodushealth.uk">www.exodushealth.uk</a></span>
        </div>
      </div>

      <p class="sig-address">
        Exodus House, 70 Draycott Avenue,<br />
        Kenton, Harrow HA3 0BU
      </p>

    </div>
    <!-- / Signature end -->

  </div>

  <button class="copy-btn" onclick="copySignature()">Copy signature HTML</button>

  <script>
    function copySignature() {
      const html = document.getElementById('sig-body').innerHTML
      const blob = new Blob([html], { type: 'text/html' })
      const item = new ClipboardItem({ 'text/html': blob })
      navigator.clipboard.write([item]).then(() => {
        const btn = document.querySelector('.copy-btn')
        btn.textContent = 'Copied!'
        btn.style.background = '#15803d'
        setTimeout(() => {
          btn.textContent = 'Copy signature HTML'
          btn.style.background = '#1E6FD9'
        }, 2000)
      })
    }
  </script>

</body>
</html>
